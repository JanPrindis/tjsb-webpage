<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/Logo_100.svg"/>

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- SEO -->
    <title>TJ Sokol Bohuňovice</title>
    <meta name="description" content="Oficiální web fotbalového oddílu TJ Sokol Bohuňovice."/>

    <!-- Keywords -->
    <meta name="keywords" content="TJ Sokol Bohuňovice, Sokol Bohuňovice, Bohuňovice, fotbal, výsledky, zápasy"/>

    <!-- Canonical -->
    <link rel="canonical" href="https://tjsbfotbal.cz/">

    <!-- Open Graph (Discord, Facebook, Messenger, etc.) -->
    <meta property="og:title" content="TJ Sokol Bohuňovice"/>
    <meta property="og:site_name" content="TJ Sokol Bohuňovice"/>
    <meta property="og:description" content="Odpočet do dalšího zápasu, výsledky a rozpis utkání."/>
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://tjsbfotbal.cz"/>
    <meta property="og:image" content="https://tjsbfotbal.cz/og-image.png"/>

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "TJ Sokol Bohuňovice",
            "url": "https://tjsbfotbal.cz/"
        }
    </script>

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="TJ Sokol Bohuňovice"/>
    <meta name="twitter:description" content="Sledujte náš tým – zápasy, výsledky a odpočet."/>
    <meta name="twitter:image" content="https://tjsbfotbal.cz/og-image.png"/>

    <!-- CSS -->
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<header class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-top">
        <img src="/Logo_100.svg" alt="Sokol" class="main-logo">
        <div class="social-links" id="header-socials">
            <span class="social-text">SLEDUJ NÁS:</span>
            <a href="https://www.instagram.com/bohunovice_fotbal/" target="_blank" class="social-icon"
               title="Instagram">
                <img src="/ig.svg" alt="IG">
            </a>
            <a href="https://www.facebook.com/TjSokolBohunovice" target="_blank" class="social-icon" title="Facebook">
                <img src="/fb.svg" alt="FB">
            </a>
            <a href="https://www.tjsokolbohunovice.cz/" target="_blank" class="social-icon" title="Web">
                <img src="/web.svg" alt="WEB">
            </a>
        </div>
    </div>

    <div id="active-match-container" class="active-match-wrapper">
        <div class="loader">Načítám...</div>
    </div>

    <div class="scroll-indicator-wrapper">
        <div class="scroll-indicator"></div>
        <div class="scroll-indicator"></div>
    </div>
</header>

<main class="content">
    <div class="section-title">ROZPIS ZÁPASŮ</div>
    <div id="schedule-container" class="schedule-list"></div>
</main>

<footer class="site-footer">
    <div class="footer-content">
        <span class="copyright">&copy; <span id="current-year"></span> Sokol Bohuňovice</span>
        <span class="separator">•</span>
        <span class="author">Designed by <strong>Jan Přindiš</strong></span>
        <span class="separator">•</span>
        <span class="author-links">
      <a href="mailto:jan.prindis3@gmail.com" title="Napiš mi">Email</a>
      <span class="link-sep">|</span>
      <a href="https://github.com/JanPrindis/" target="_blank" title="GitHub">GitHub</a>
      <span class="link-sep">|</span>
      <a href="https://www.instagram.com/jan_prindis" target="_blank" title="Instagram">IG</a>
    </span>
    </div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
